
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="../static/stock_style.css">
  <style>
    :root{--bg:#f4f5f7;--ring:#e6e6e6;--muted:#666;--card:#fff;--brand:#28a745}
    html,body{height:100%;margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    .page{height:100%;display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    header h1{margin:0;font-size:18px;font-weight:600}
    header .hint{color:var(--muted);font-size:12px}
    .wrap{max-width:1320px;margin:0 auto;width:100%;padding:0 12px}
    .tiles{height:calc(100% - 8px);display:grid;gap:12px;grid-template-columns:repeat(3, 1fr);grid-template-rows:repeat(2, 1fr);}
    .tile{background:var(--card);border:1px solid var(--ring);border-radius:12px;display:flex;flex-direction:column;min-width:0;min-height:0;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
    .tile header{padding:8px 12px;border-bottom:1px solid var(--ring)}
    .tile header h3{margin:0;font-size:14px;font-weight:600}
    .thumb{flex:1;min-height:0;display:grid;place-items:center;background:#fafafa}
    .thumb canvas,.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
    .tile footer{padding:8px 12px;border-top:1px solid var(--ring);display:flex;justify-content:flex-end;gap:8px}
    .btn{background:var(--brand);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
    .btn[disabled]{opacity:.5;cursor:not-allowed}
    .btn:hover:not([disabled]){filter:brightness(.95)}
    @media (max-width: 1100px){.tiles{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3, minmax(220px,1fr));height:auto}.page{grid-template-rows:auto auto}}
    @media (max-width: 720px){.tiles{grid-template-columns:1fr;grid-template-rows:none}}
  </style>
</head>
<body>
  <div class="page">
    <header class="wrap">
      <h1>Dashboard</h1>
      <div class="hint">6 equal sections · click to open full view</div>
    </header>

    <main class="wrap">
      <section class="tiles">
        <!-- TILE 1: Volume Contraction -->
        <div class="tile" id="tile-volume">
          <header><h3>📉 Volume Contraction</h3></header>
          <div class="thumb"><img src="/volume_contraction_chart" alt="Volume Contraction Chart"></div>
          <footer><a href="/dashboard/volume"><button class="btn">Open</button></a></footer>
        </div>

        <!-- TILE 2: All Sectors Scatter (PDF) -->
        <div class="tile" id="tile-pdf">
          <header><h3>📄 All Sectors Scatter (PDF)</h3></header>
          <div class="thumb"><canvas id="pdf-thumb"></canvas></div>
          <footer><a href="/dashboard/pdf"><button class="btn">Open</button></a></footer>
        </div>

        <!-- TILE 3: RSI Oversold (Chartink) -->
        <div class="tile" id="tile-rsi">
          <header><h3>🧭 RSI Oversold – KK Daily RSI experiment_Oversold</h3></header>
          <div class="thumb" style="padding:8px; overflow:auto">
            <table id="rsi-mini" style="width:100%; font-size:12px; border-collapse:collapse">
              <thead>
                <tr>
                  <th style="text-align:left">Symbol</th>
                  <th style="text-align:right">Price</th>
                  <th style="text-align:right">RSI</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="3" style="text-align:center;color:#666">Loading…</td></tr>
              </tbody>
            </table>
          </div>
          <footer><a href="/dashboard/rsi_oversold"><button class="btn">Open</button></a></footer>
        </div>

        <!-- TILE 4: Placeholder -->
        <div class="tile"><header><h3>🔥 Breakouts / Setups</h3></header><div class="thumb">Coming soon</div><footer><button class="btn" disabled>Open</button></footer></div>
        <!-- TILE 5: Placeholder -->
        <div class="tile"><header><h3>🌡️ Sector Heatmap</h3></header><div class="thumb">Coming soon</div><footer><button class="btn" disabled>Open</button></footer></div>
        <!-- TILE 6: Placeholder -->
        <div class="tile"><header><h3>💰 FII/DII Flows</h3></header><div class="thumb">Coming soon</div><footer><button class="btn" disabled>Open</button></footer></div>

      </section>
    </main>
  </div>

  <!-- PDF thumbnail (renders page 1) -->
  <script type="module">
    import * as pdfjsLib from '../static/build/pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = '../static/build/pdf.worker.mjs';
    const pdfUrl = "{{ url_for('static', filename='dynamic_plots/all_sectors_combined.pdf') }}";
    const canvas = document.getElementById('pdf-thumb');
    const ctx = canvas?.getContext('2d');
    if (canvas && ctx) {
      pdfjsLib.getDocument(pdfUrl).promise.then(pdf => pdf.getPage(1)).then(page => {
        const targetW = canvas.clientWidth || 380;
        const v0 = page.getViewport({ scale: 1 });
        const scale = targetW / v0.width;
        const vp = page.getViewport({ scale });
        canvas.width = vp.width; canvas.height = vp.height;
        return page.render({ canvasContext: ctx, viewport: vp }).promise;
      }).catch(()=>{
        const box = document.querySelector('#tile-pdf .thumb');
        if (box) box.textContent = 'PDF preview not available';
      });
    }
  </script>

  <!-- RSI mini table fetch -->
  <script>
    fetch("/api/rsi_oversold_csv")
      .then(r => r.json())
      .then(js => {
        const tb = document.querySelector("#rsi-mini tbody");
        if (!js.ok || !js.rows || !js.rows.length) {
          tb.innerHTML = `<tr><td colspan="3" style="text-align:center;color:#c00">No data</td></tr>`;
          return;
        }
        const rows = js.rows.slice(0, 12);
        tb.innerHTML = rows.map(r => {
          const sym = r.n || r.symbol || "";
          const price = (r.price ?? r.ltp ?? r.p ?? "").toString();
          const rsi = (r.rsi ?? r.RSI ?? "").toString();
          return `<tr>
            <td>${sym}</td>
            <td style="text-align:right">${price}</td>
            <td style="text-align:right">${rsi}</td>
          </tr>`;
        }).join("");
      })
      .catch(() => {
        document.querySelector("#rsi-mini tbody").innerHTML =
          `<tr><td colspan="3" style="text-align:center;color:#c00">Fetch error</td></tr>`;
      });
  </script>
</body>
</html>
